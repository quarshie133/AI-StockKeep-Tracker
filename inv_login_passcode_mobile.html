<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StockKeep - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#f8f9fa",
                    "surface-container-high": "#e7e8e9",
                    "tertiary-fixed-dim": "#ffb4a8",
                    "secondary-fixed": "#e2e2e2",
                    "status-healthy": "#10B981",
                    "inverse-surface": "#2e3132",
                    "secondary-fixed-dim": "#c6c6c7",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#84d6b9",
                    "surface-variant": "#e1e3e4",
                    "tertiary": "#78352b",
                    "error": "#ba1a1a",
                    "on-primary-container": "#9aedcf",
                    "status-critical": "#EF4444",
                    "surface-tint": "#086b53",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f3f4f5",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#f0f1f2",
                    "inverse-primary": "#84d6b9",
                    "secondary": "#5d5f5f",
                    "secondary-container": "#dfe0e0",
                    "surface": "#f8f9fa",
                    "error-container": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#191c1d",
                    "primary-fixed": "#a0f3d4",
                    "on-primary-fixed": "#002117",
                    "on-tertiary": "#ffffff",
                    "background": "#f8f9fa",
                    "error-red": "#DC2626",
                    "surface-container-highest": "#e1e3e4",
                    "surface-container": "#edeeef",
                    "tertiary-fixed": "#ffdad4",
                    "primary": "#005440",
                    "status-low": "#F59E0B",
                    "border-subtle": "#E5E7EB",
                    "on-tertiary-fixed-variant": "#743329",
                    "on-secondary-container": "#616363",
                    "on-secondary-fixed-variant": "#454747",
                    "on-tertiary-container": "#ffd3cc",
                    "on-secondary": "#ffffff",
                    "on-surface": "#191c1d",
                    "primary-container": "#0f6e56",
                    "on-secondary-fixed": "#1a1c1c",
                    "outline": "#6f7a74",
                    "on-surface-variant": "#3f4944",
                    "surface-dim": "#d9dadb",
                    "outline-variant": "#bec9c3",
                    "on-primary-fixed-variant": "#00513e",
                    "tertiary-container": "#954c41",
                    "on-tertiary-fixed": "#3b0804"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "gutter": "16px",
                    "margin-desktop": "32px",
                    "xs": "4px",
                    "sm": "8px",
                    "lg": "24px",
                    "margin-mobile": "16px",
                    "md": "16px",
                    "base": "4px"
            },
            "fontFamily": {
                    "body-sm": ["Hanken Grotesk"],
                    "label-md": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "label-sm": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface flex flex-col h-screen md:hidden">
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile relative z-10">
<!-- Logo and Title -->
<div class="mb-xl text-center">
<span class="material-symbols-outlined text-[48px] text-primary mb-sm">inventory_2</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">StockKeep</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Inventory Manager</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest w-full rounded-xl border border-border-subtle p-lg shadow-sm">
<form class="flex flex-col gap-lg" id="loginForm">
<!-- Passcode Input (Error State) -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="passcode">Passcode</label>
<div class="relative">
<input class="w-full h-12 rounded-lg border-1.5 border-status-critical bg-surface-container-lowest px-md font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-0 focus:border-status-critical tracking-widest text-center placeholder:tracking-normal placeholder:text-left" id="passcode" inputmode="numeric" maxlength="4" placeholder="Enter 4-digit PIN" type="password" value="1234"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-status-critical mt-[4px]">Incorrect passcode. Please try again.</p>
</div>
<!-- Unlock Button -->
<button class="w-full h-12 bg-[#0F6E56] hover:bg-surface-tint active:scale-[0.98] transition-transform text-white font-label-md text-label-md rounded-lg flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[20px]">lock_open</span>
                    Unlock
                </button>
</form>
</div>
</main>
<!-- Visual Keyboard Dock -->
<div class="w-full bg-[#d1d5db] pb-safe pt-2 px-1 grid gap-1.5 border-t border-border-subtle shrink-0">
<div class="grid grid-cols-3 gap-1.5">
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container">1</button>
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container flex flex-col items-center justify-center leading-tight">2 <span class="text-[10px] text-on-surface-variant font-normal">ABC</span></button>
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container flex flex-col items-center justify-center leading-tight">3 <span class="text-[10px] text-on-surface-variant font-normal">DEF</span></button>
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container flex flex-col items-center justify-center leading-tight">4 <span class="text-[10px] text-on-surface-variant font-normal">GHI</span></button>
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container flex flex-col items-center justify-center leading-tight">5 <span class="text-[10px] text-on-surface-variant font-normal">JKL</span></button>
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container flex flex-col items-center justify-center leading-tight">6 <span class="text-[10px] text-on-surface-variant font-normal">MNO</span></button>
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container flex flex-col items-center justify-center leading-tight">7 <span class="text-[10px] text-on-surface-variant font-normal">PQRS</span></button>
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container flex flex-col items-center justify-center leading-tight">8 <span class="text-[10px] text-on-surface-variant font-normal">TUV</span></button>
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container flex flex-col items-center justify-center leading-tight">9 <span class="text-[10px] text-on-surface-variant font-normal">WXYZ</span></button>
<div class="h-12 bg-transparent"></div>
<button class="bg-surface-container-lowest h-12 rounded shadow-sm font-headline-md text-headline-md text-on-surface active:bg-surface-container">0</button>
<button class="bg-[#b5bac1] h-12 rounded shadow-sm flex items-center justify-center active:bg-gray-400">
<span class="material-symbols-outlined text-[24px] text-on-surface">backspace</span>
</button>
</div>
</div>
</body></html>
