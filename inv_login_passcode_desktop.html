<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

              "spacing": {

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
      </style>

<body class="bg-background min-h-screen flex items-center justify-center p-gutter">
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl w-full max-w-sm p-lg">
<!-- Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-on-primary-container mb-md">
<span class="material-symbols-outlined" data-icon="inventory_2" data-weight="fill" style="font-size: 28px;">inventory_2</span>
</div>
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg font-headline-lg-mobile text-headline-lg-mobile text-on-surface">StockKeep</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Inventory Manager</p>
</div>
<!-- Session Expired Message -->
<div class="bg-surface-container-high rounded-lg p-sm mb-md flex items-center gap-sm text-on-surface-variant font-body-sm text-body-sm">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="info" style="font-size: 18px;">info</span>
<span>Session expired. Please re-enter passcode.</span>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Default Input (Hidden to show error state for prompt requirement, normally toggled) -->
<!--
            <div class="space-y-xs">
                <label for="passcode-default" class="font-label-md text-label-md text-on-surface">Passcode</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="lock">lock</span>
                    <input type="password" id="passcode-default" placeholder="Enter your pin" class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-border-subtle rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container">
                </div>
            </div>
            -->
<!-- Error State Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="passcode-error">Passcode</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-error-red" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border-[1.5px] border-error-red rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none" id="passcode-error" type="password" value="12345"/>
</div>
<div class="flex items-center gap-1 mt-[4px] text-error-red">
<span class="material-symbols-outlined" data-icon="error" style="font-size: 16px;">error</span>
<span class="font-label-sm text-label-sm">Incorrect passcode, try again</span>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-surface-tint active:scale-[0.98] transition-all" type="button">
<span class="material-symbols-outlined" data-icon="lock_open">lock_open</span>
                Unlock
            </button>
</form>
</div>
</body></html>
