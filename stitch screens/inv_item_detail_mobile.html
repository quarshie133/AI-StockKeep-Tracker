<style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap');
        
        /* Hide scrollbar for cleaner mobile look while allowing scroll */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-sm h-screen flex flex-col overflow-hidden antialiased">
<!-- TopAppBar (Adapted for Detail View based on Contextual State Logic) -->
<header class="bg-surface flex justify-between items-center w-full px-margin-mobile h-16 border-b border-border-subtle shrink-0 z-10">
<!-- Back Navigation (Implied by detail view context) -->
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-secondary-container active:scale-95 transition-all duration-150 text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<!-- Center Title -->
<div class="font-headline-md text-headline-md text-on-surface truncate px-md flex-1 text-center">
            Item Details
        </div>
<!-- Trailing Actions (Requested: Edit/Delete) -->
<div class="flex items-center gap-xs">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-secondary-container active:scale-95 transition-all duration-150 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">edit</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-error-container active:scale-95 transition-all duration-150 text-error">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">delete</span>
</button>
</div>
</header>
<!-- Main Content Canvas (Scrollable) -->
<main class="flex-1 overflow-y-auto px-margin-mobile pt-md pb-[100px]">
<!-- Product Image Placeholder -->
<div class="w-full aspect-square md:aspect-video rounded-xl bg-surface-container-high overflow-hidden mb-lg border border-border-subtle flex items-center justify-center relative">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A clean, minimalist product shot of a premium ceramic coffee mug resting on a solid white surface. The lighting is bright, even, and studio-quality, casting soft, diffused shadows. The color palette is composed of crisp whites, soft grays, and the subtle earthy tones of the mug, fitting a modern, corporate light-mode inventory application. High contrast and sharp focus." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAxfqZ65G6KtwhYkLOyKzwCUYGC8-SAComJecGRoqjdwcG9bZM1mBb3jqQlm0ExP5sbuCloqsq_hB03sENWYcQNj-4vC30RLqMxpfBTd8jo0jxnYwzcxbBTD4nLAeFDXD78bQcemwLtTLMvWLrCsoWqecG4XkMpY6aPE5SECXzv44yKtH8narR9qi1kYFyh8nxKsg-0136yggmQnKrrkN36mguyrrYkGrI6n_eDv0GIYvX6_xdj8Rr8')"></div>
</div>
<!-- Stacked Info Header -->
<div class="mb-lg">
<div class="flex justify-between items-start mb-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface pr-sm">Artisan Ceramic Mug</h1>
<!-- Status Pill (Healthy) -->
<span class="bg-status-healthy/10 text-status-healthy px-sm py-[2px] rounded-full font-label-sm text-label-sm whitespace-nowrap shrink-0 mt-1">
                    In Stock
                </span>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant">Drinkware &amp; Ceramics</p>
</div>
<!-- Current Quantity Bento Card (Primary Focus) -->
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl p-lg flex flex-col items-center justify-center mb-lg relative overflow-hidden">
<!-- Subtle background accent for primary brand color -->
<div class="absolute top-0 right-0 w-24 h-24 bg-primary-container/10 rounded-bl-full -mr-4 -mt-4 pointer-events-none"></div>
<span class="font-label-md text-label-md text-on-surface-variant mb-xs">Current Quantity</span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-lg text-[48px] leading-none text-primary font-bold">142</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">units</span>
</div>
</div>
<!-- Secondary Details List (Cards/Surface Level 1 logic) -->
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl overflow-hidden mb-lg">
<div class="px-md py-sm border-b border-border-subtle bg-surface-bright/50">
<h3 class="font-label-md text-label-md text-on-surface">Item Specifics</h3>
</div>
<div class="flex flex-col">
<!-- Row 1 -->
<div class="flex justify-between items-center py-md px-md border-b border-border-subtle last:border-0">
<span class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">barcode</span>
                        SKU
                    </span>
<span class="font-body-sm text-body-sm text-on-surface font-medium">MUG-CER-001</span>
</div>
<!-- Row 2 -->
<div class="flex justify-between items-center py-md px-md border-b border-border-subtle last:border-0">
<span class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        Location
                    </span>
<span class="font-body-sm text-body-sm text-on-surface font-medium">Aisle 4, Shelf B</span>
</div>
<!-- Row 3 -->
<div class="flex justify-between items-center py-md px-md border-b border-border-subtle last:border-0">
<span class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">sell</span>
                        Unit Price
                    </span>
<span class="font-body-sm text-body-sm text-on-surface font-medium">$12.50</span>
</div>
</div>
</div>
<!-- Thresholds Card -->
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl p-md flex justify-between items-center">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Low Stock Alert</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Alert triggers at</span>
</div>
<div class="bg-surface-container p-sm rounded-lg font-label-md text-label-md text-on-surface">
                 25 units
             </div>
</div>
</main>
<!-- Bottom Action Bar (Contextual Overriding standard BottomNavBar) -->
<!-- Applies Fluid Grid mobile logic (one-handed operation, dense action area) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-border-subtle px-margin-mobile py-sm pb-6 z-50 flex gap-sm shadow-[0_-4px_12px_rgba(0,0,0,0.02)]">
<!-- Stock Out (Secondary Button Style) -->
<button class="flex-1 h-12 flex items-center justify-center gap-xs bg-surface-container-lowest border border-primary text-primary rounded-lg font-label-md text-label-md active:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">remove</span>
            Stock out
        </button>
<!-- Stock In (Primary Button Style) -->
<button class="flex-1 h-12 flex items-center justify-center gap-xs bg-primary text-on-primary rounded-lg font-label-md text-label-md active:scale-[0.98] transition-transform shadow-sm hover:bg-primary-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">add</span>
            Stock in
        </button>
</div>
</body></html>
