<style>
    body {
        font-family: 'Hanken Grotesk', sans-serif;
    }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-dim h-screen w-full flex flex-col justify-end overflow-hidden relative">
<!-- Dimmed Background Overlay -->
<div aria-hidden="true" class="absolute inset-0 bg-on-surface opacity-20 z-10"></div>
<!-- Bottom Sheet -->
<div class="bg-surface-container-lowest w-full rounded-t-[24px] shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] z-20 flex flex-col pt-sm pb-[32px] px-margin-mobile relative transform transition-transform duration-300 translate-y-0">
<!-- Drag Handle -->
<div class="w-full flex justify-center mb-md">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between mb-lg">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Adjust Stock</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Premium Roast Coffee Beans</p>
</div>
<button class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Current Stock Info -->
<div class="flex items-center justify-between p-md bg-surface border border-border-subtle rounded-lg mb-lg">
<span class="font-body-sm text-body-sm text-on-surface-variant">Current Stock</span>
<span class="font-label-md text-label-md text-on-surface">12 units</span>
</div>
<!-- Adjustment Controls -->
<div class="flex flex-col gap-md mb-lg">
<div class="flex justify-between items-center bg-surface-container-low rounded-xl p-xs border-1.5 border-error-red">
<button aria-label="Decrease stock" class="w-[44px] h-[44px] flex items-center justify-center text-primary bg-surface-container-lowest rounded-lg shadow-sm active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="flex-1 text-center">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">-15</span>
</div>
<button aria-label="Increase stock" class="w-[44px] h-[44px] flex items-center justify-center text-primary bg-surface-container-lowest rounded-lg shadow-sm active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<!-- Error State Message -->
<div class="flex items-center gap-xs text-error-red mt-[-4px]">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="font-label-sm text-label-sm">Not enough stock to deduct.</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-surface-container-high text-on-surface-variant font-label-md text-label-md rounded-lg flex items-center justify-center cursor-not-allowed" disabled="">
            Confirm Adjustment
        </button>
<p class="font-body-sm text-body-sm text-center text-on-surface-variant mt-sm opacity-60">Resulting stock: -3</p>
</div>
</body></html>
