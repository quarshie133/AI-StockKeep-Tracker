<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StockKeep — Shop Inventory Alert System</title>
<meta name="description" content="StockKeep is a smart shop inventory alert system for tracking stock, managing items, and receiving low-stock alerts."/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config={darkMode:"class",theme:{extend:{colors:{"surface-bright":"#f8f9fa","surface-container-high":"#e7e8e9","status-healthy":"#10B981","status-low":"#F59E0B","status-critical":"#EF4444","primary":"#005440","primary-container":"#0f6e56","on-primary-container":"#9aedcf","primary-fixed":"#a0f3d4","on-primary":"#ffffff","surface":"#f8f9fa","surface-dim":"#d9dadb","surface-tint":"#086b53","surface-container":"#edeeef","surface-container-low":"#f3f4f5","surface-container-lowest":"#ffffff","surface-container-highest":"#e1e3e4","background":"#f8f9fa","on-surface":"#191c1d","on-surface-variant":"#3f4944","outline":"#6f7a74","outline-variant":"#bec9c3","border-subtle":"#E5E7EB","secondary-container":"#dfe0e0","error":"#ba1a1a","error-red":"#DC2626","error-container":"#ffdad6","inverse-surface":"#2e3132","inverse-on-surface":"#f0f1f2"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{xl:"32px",gutter:"16px","margin-desktop":"32px",xs:"4px",sm:"8px",lg:"24px","margin-mobile":"16px",md:"16px",base:"4px"},fontFamily:{"body-sm":["Hanken Grotesk"],"label-md":["Hanken Grotesk"],"body-lg":["Hanken Grotesk"],"headline-lg":["Hanken Grotesk"],"headline-md":["Hanken Grotesk"],"label-sm":["Hanken Grotesk"]},fontSize:{"body-sm":["14px",{lineHeight:"20px",fontWeight:"400"}],"label-md":["14px",{lineHeight:"20px",fontWeight:"600"}],"body-lg":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg":["28px",{lineHeight:"36px",letterSpacing:"-0.02em",fontWeight:"700"}],"headline-md":["20px",{lineHeight:"28px",fontWeight:"600"}],"label-sm":["12px",{lineHeight:"16px",fontWeight:"500"}]}}}};
</script>
<style>
*{box-sizing:border-box}body{font-family:'Hanken Grotesk',sans-serif}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.page{display:none}.page.active{display:flex}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#191c1d;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;transition:transform 0.3s ease;white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.nav-active{background-color:#0f6e56;color:#9aedcf;font-weight:600}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#bec9c3;border-radius:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#005440;box-shadow:0 0 0 2px rgba(0,84,64,0.15)}
.error-field{border-color:#DC2626!important;box-shadow:0 0 0 2px rgba(220,38,38,0.1)!important}
.stat-card{transition:transform 0.15s,box-shadow 0.15s}.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.10)}
tbody tr{transition:background-color 0.1s;cursor:pointer}tbody tr:hover{background-color:rgba(0,84,64,0.04)}
.row-acts{opacity:0;transition:opacity 0.15s}tbody tr:hover .row-acts,tbody tr:focus-within .row-acts{opacity:1}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(25,28,29,0.4);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center}
.modal-backdrop.open{display:flex;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{transform:scale(0.95);opacity:0;transition:transform 0.2s ease,opacity 0.2s ease}
.modal-backdrop.open .modal-card{transform:scale(1);opacity:1}
.badge-H{background:rgba(16,185,129,.1);color:#059669}
.badge-L{background:rgba(245,158,11,.1);color:#D97706}
.badge-C{background:rgba(239,68,68,.1);color:#DC2626}
#sidebar{transition:transform 0.25s ease}
@media(max-width:767px){#sidebar{position:fixed;top:0;left:0;bottom:0;z-index:200;transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}#sidebar-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:199}#sidebar-ov.open{display:block}}
.qty-btn{transition:background .1s,transform .1s}.qty-btn:active{transform:scale(0.92)}
.type-btn{transition:all .15s}
.type-btn.t-in{background:rgba(15,110,86,.12);color:#005440;border-color:#005440}
.type-btn.t-out{background:rgba(220,38,38,.1);color:#DC2626;border-color:#DC2626}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.inner-page{animation:fadeIn 0.18s ease}
.login-card{box-shadow:0 8px 40px rgba(0,84,64,.12)}
</style>
</head>
<body class="bg-background text-on-surface min-h-screen">
<div id="toast"></div>
<div id="sidebar-ov" onclick="closeSB()"></div>
